# DHL News Admin Worker settings.
# SECRETS ARE NOT STORED HERE. Set them with:
#   npx wrangler secret put GITHUB_TOKEN
#   npx wrangler secret put GITHUB_CLIENT_SECRET
#   npx wrangler secret put SESSION_SECRET

name = "dhl-news-admin"
main = "worker.js"
compatibility_date = "2026-09-01"

[vars]
# Your repository: https://github.com/GITHUB_OWNER/GITHUB_REPO  (fill these in: your GitHub username and repository name)
GITHUB_OWNER = "your-github-username"
GITHUB_REPO = "your-repository"
GITHUB_BRANCH = "main"
POSTS_PATH = "content/posts.json"

# From your GitHub OAuth App (the Client ID is not secret)
GITHUB_CLIENT_ID = "your-oauth-app-client-id"

# The full address of admin.html on your published site
ADMIN_PAGE_URL = "https://www.diasporahubforleaders.com/admin.html"

# GitHub usernames allowed to publish, comma-separated
ADMIN_USERS = "your-github-username"
